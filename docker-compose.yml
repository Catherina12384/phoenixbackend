services:
  db:
    image: postgres:16
    container_name: phoenix-db
    environment:
      POSTGRES_DB: phoenix
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix
    ports:
      - "5432:5432"
    volumes:
      - phoenix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  phoenix-pgdata:
